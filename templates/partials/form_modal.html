<div class="modal fade" id="recordModal" tabindex="-1" aria-labelledby="recordModalLabel" aria-hidden="true"
     {% if editing or form.errors %}data-auto-open="1" data-reset-url="{% url cancel_url %}"{% endif %}>
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <form method="post" novalidate>
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title text-capitalize" id="recordModalLabel">
            {% if editing %}Edit {{ noun }} #{{ editing.pk }}{% elif card_title %}{{ card_title }}{% else %}Add {{ noun }}{% endif %}
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          {% if form.non_field_errors %}
          <div class="alert alert-danger text-white py-2 text-sm">{{ form.non_field_errors }}</div>
          {% endif %}
          {% include 'partials/form_fields.html' %}
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary mb-0" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn bg-gradient-dark mb-0">{% if submit_label %}{{ submit_label }}{% elif editing %}Update {{ noun }}{% else %}Save {{ noun }}{% endif %}</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var el = document.getElementById('recordModal');
    if (!el || typeof bootstrap === 'undefined') return;
    var modal = bootstrap.Modal.getOrCreateInstance(el);

    // editing, or the last save had errors: open straight away
    if (el.dataset.autoOpen) modal.show();

    // put the cursor on the first invalid field, otherwise the first field
    el.addEventListener('shown.bs.modal', function () {
      var target = el.querySelector('.is-invalid, [aria-invalid="true"]') ||
                   el.querySelector('input:not([type=hidden]), select, textarea');
      if (target) target.focus();
    });

    // closing an edit (or an errored add) goes back to the clean list page
    el.addEventListener('hidden.bs.modal', function () {
      if (el.dataset.resetUrl) window.location.href = el.dataset.resetUrl;
    });
  });
</script>
