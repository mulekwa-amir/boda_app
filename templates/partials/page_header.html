{# params: title, lede #}
<nav class="navbar navbar-main navbar-expand-lg px-0 mx-3 shadow-none border-radius-xl" id="navbarBlur" data-scroll="true">
  <div class="container-fluid py-1 px-3">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb bg-transparent mb-0 pb-0 pt-1 px-0 me-sm-6 me-5">
        <li class="breadcrumb-item text-sm"><a class="opacity-5 text-dark" href="{% url 'index' %}">{{ role_label|default:"Home" }}</a></li>
        <li class="breadcrumb-item text-sm text-dark active" aria-current="page">{{ title }}</li>
      </ol>
    </nav>
    <ul class="navbar-nav d-flex align-items-center justify-content-end ms-auto">
      <li class="nav-item d-xl-none ps-3 d-flex align-items-center">
        <a href="javascript:;" class="nav-link text-body p-0" id="iconNavbarSidenav">
          <div class="sidenav-toggler-inner">
            <i class="sidenav-toggler-line"></i><i class="sidenav-toggler-line"></i><i class="sidenav-toggler-line"></i>
          </div>
        </a>
      </li>
    </ul>
  </div>
</nav>
<div class="container-fluid pt-3">
  <div class="ms-1 mb-2">
    <h3 class="mb-0 h4 font-weight-bolder">{{ title }}</h3>
    {% if lede %}<p class="mb-0 text-sm">{{ lede }}</p>{% endif %}
  </div>
</div>
