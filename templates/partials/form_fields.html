{# param: form — renders every field with its label, errors and help text #}
{% for field in form %}
<div class="mb-3">
  <label for="{{ field.id_for_label }}" class="form-label text-sm mb-1 fw-bold">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>
  {{ field }}
  {% for error in field.errors %}<div class="text-danger text-xs mt-1">{{ error }}</div>{% endfor %}
  {% if field.help_text %}<div class="text-secondary text-xs mt-1">{{ field.help_text|safe }}</div>{% endif %}
</div>
{% endfor %}
