services:
  - type: web
    name: bodaapp
    runtime: python
    plan: free
    buildCommand: "bash ./build.sh"
    startCommand: "gunicorn mybodaapp.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.1"
      - key: DJANGO_SETTINGS_MODULE
        value: mybodaapp.settings
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "4"
